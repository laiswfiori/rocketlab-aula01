# Job exportado (formato Databricks Asset Bundle). Ajuste <seu_usuario> e o caminho dos notebooks.
resources:
  jobs:
    CineData_Pipeline:
      name: CineData_Pipeline
      description: Pipeline Medalhão CineData (Bronze -> Silver -> Gold)
      schedule:
        quartz_cron_expression: 0 0 6 * * ?   # todos os dias às 06:00
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
        - task_key: to_Bronze
          notebook_task:
            notebook_path: /Workspace/Users/<seu_usuario>/CineData/Landing_to_Bronze
            base_parameters:
              volume_path: /Volumes/workspace/default/cinedata_inputs
              data_inicio: ""
              data_fim: ""
            source: WORKSPACE
        - task_key: to_Silver
          depends_on:
            - task_key: to_Bronze
          notebook_task:
            notebook_path: /Workspace/Users/<seu_usuario>/CineData/Bronze_to_Silver
            source: WORKSPACE
        - task_key: to_Gold
          depends_on:
            - task_key: to_Silver
          notebook_task:
            notebook_path: /Workspace/Users/<seu_usuario>/CineData/Silver_to_Gold
            source: WORKSPACE
